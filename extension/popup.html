<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dodx – Official Shopping Partners & Verified Deals</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-shell">
      <!-- Primary Header (#00453E) -->
      <header class="dodx-header">
        <a
          href="https://www.dodx.shop"
          data-external-url="https://www.dodx.shop"
          target="_blank"
          rel="noopener noreferrer"
          class="dodx-logo"
          dir="ltr"
          aria-label="Open https://www.dodx.shop"
        >
          <img
            src="icons/icon48.png"
            alt=""
            width="28"
            height="28"
            class="dodx-brand-icon"
          />
          <span class="dodx-wordmark">
            <span class="dodx-letters">dodx</span>
            <svg viewBox="0 0 64 12" class="dodx-smile" fill="none" aria-hidden="true">
              <path d="M5 2.5C15 8.5 29 8.5 39 2.5" stroke="#FF9900" stroke-width="2.6" stroke-linecap="round" />
              <path d="M35.2 1.2L40.4 2.3L37.8 7.1" stroke="#FF9900" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span class="dodx-tld">.shop</span>
        </a>

        <div class="header-actions">
          <div id="flash-timer-pill" class="flash-timer-pill" title="Flash Deal Countdown" dir="ltr">
            <span>⚡</span>
            <span id="flash-countdown">05:59:59</span>
          </div>

          <div id="lang-picker" class="lang-picker">
            <button
              id="lang-btn"
              type="button"
              class="lang-btn"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-label="Select display language"
              title="Select display language"
            >
              <span id="lang-flag" class="lang-flag" aria-hidden="true">🇺🇸</span>
              <span id="lang-code" class="lang-code">EN</span>
              <span class="lang-caret" aria-hidden="true">▾</span>
            </button>
            <div id="lang-menu" class="lang-menu" role="dialog" aria-label="Display Language" hidden>
              <div id="lang-menu-title" class="lang-menu-title">Display Language</div>
              <div id="lang-options-grid" class="lang-options-grid" role="listbox"></div>
              <div class="lang-extra-wrap">
                <label id="extra-lang-label" for="extra-lang-select" class="lang-extra-label">More world languages (Translate):</label>
                <select id="extra-lang-select" class="lang-extra-select">
                  <option value="">Select another language...</option>
                </select>
              </div>
            </div>
          </div>

          <button
            id="popout-btn"
            type="button"
            class="icon-btn"
            title="Open in standalone window"
            aria-label="Open extension in standalone popup window"
          >
            <svg viewBox="0 0 24 24" class="popout-icon" fill="none" stroke="currentColor" stroke-width="2.1" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 5h5v5m0-5L10 14" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 13v5a1 1 0 01-1 1H6a1 1 0 01-1-1V6a1 1 0 011-1h5" />
            </svg>
          </button>
          <button
            id="refresh-btn"
            type="button"
            class="icon-btn"
            title="Sync latest offers"
            aria-label="Sync latest offers"
          >
            <svg viewBox="0 0 24 24" class="refresh-icon" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Official Website & Coupons Bar -->
      <div class="official-top-bar">
        <a
          href="https://www.dodx.shop"
          data-external-url="https://www.dodx.shop"
          target="_blank"
          rel="noopener noreferrer"
          class="official-site-link"
        >
          <span class="official-site-dot" aria-hidden="true"></span>
          <span id="top-bar-tagline"><strong>dodx.shop</strong> · Verified Deals</span>
        </a>
        <div class="top-bar-actions">
          <span id="active-domain" class="active-domain" title="Current active tab">dodx.shop</span>
          <button id="coupons-mode-btn" type="button" class="top-coupons-btn">
            Coupons
          </button>
          <a
            id="top-products-link"
            href="https://www.dodx.shop/products"
            data-external-url="https://www.dodx.shop/products"
            target="_blank"
            rel="noopener noreferrer"
            class="official-top-products"
          >
            Products
          </a>
        </div>
      </div>

      <!-- Search, Category Filter & Store Hierarchy Controls -->
      <div class="dodx-subbar">
        <div class="search-wrap">
          <input
            id="offer-search"
            type="search"
            placeholder="Search iPhone, laptop, Samsung, Amazon..."
            aria-label="Search products and stores"
            class="search-input"
          />
          <span class="search-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" class="search-icon" fill="none" stroke="currentColor" stroke-width="2.4">
              <circle cx="11" cy="11" r="7" />
              <path stroke-linecap="round" d="M20 20l-3.5-3.5" />
            </svg>
          </span>
        </div>

        <div class="filter-selects-row">
          <select id="category-filter" class="filter-select" aria-label="Filter by category">
            <option value="all">All Categories</option>
          </select>
          <select id="price-filter" class="filter-select" aria-label="Filter by price bracket">
            <option value="all">All Price Tiers</option>
          </select>
        </div>

        <nav id="store-tabs" class="store-tabs" aria-label="Parent stores"></nav>
        <nav id="branch-tabs" class="branch-tabs" aria-label="Country stores" hidden></nav>
      </div>

      <div id="status-bar" class="status-bar" hidden></div>

      <main id="popup-content" class="popup-content">
        <div id="loading-card" class="loading-card">Loading products &amp; stores from dodx.shop...</div>
      </main>

      <footer class="popup-footer">
        <p id="affiliate-disclosure" class="disclosure-text">
          Affiliate Disclosure: As an affiliate, dodx.shop may earn a commission from qualifying purchases at no extra cost to you.
        </p>
        <div class="footer-links">
          <a href="https://www.dodx.shop" data-external-url="https://www.dodx.shop" target="_blank" rel="noopener noreferrer" class="footer-link footer-link-primary">dodx.shop ↗</a>
          <span class="dot" aria-hidden="true">·</span>
          <a id="footer-coupons-link" href="https://www.dodx.shop/coupons" data-external-url="https://www.dodx.shop/coupons" target="_blank" rel="noopener noreferrer" class="footer-link">Coupons</a>
          <span class="dot" aria-hidden="true">·</span>
          <a id="footer-products-link" href="https://www.dodx.shop/products" data-external-url="https://www.dodx.shop/products" target="_blank" rel="noopener noreferrer" class="footer-link">Products</a>
          <span class="dot" aria-hidden="true">·</span>
          <a id="footer-disclosure-link" href="https://www.dodx.shop/disclosure" data-external-url="https://www.dodx.shop/disclosure" target="_blank" rel="noopener noreferrer" class="footer-link">Disclosure</a>
        </div>
      </footer>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
